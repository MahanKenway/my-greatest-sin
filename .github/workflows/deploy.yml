name: Deploy static My Greatest Sin site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Publish dist/public to gh-pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages
          git worktree add ../my-greatest-sin-pages gh-pages
          rsync -a --delete dist/public/ ../my-greatest-sin-pages/
          cd ../my-greatest-sin-pages
          git add --all
          if git diff --cached --quiet; then
            echo "No published changes."
          else
            git commit -m "Deploy ${GITHUB_SHA}"
            git push origin HEAD:gh-pages
          fi
